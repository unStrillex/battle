name: Android Build

# 涓绘瀯寤哄伐浣滄祦
# 瑙﹀彂鏉′欢锛?#   - push 鍒?main / develop 鍒嗘敮
#   - 鍒涘缓 v* tag 鈫?鑷姩鍙戝竷 Release
#   - Pull Request
#   - 鎵嬪姩瑙﹀彂

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '鏋勫缓绫诲瀷'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      upload_to_cdn:
        description: '涓婁紶鍒?CDN'
        required: false
        default: 'false'
        type: boolean

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  ANDROID_HOME: /opt/android-sdk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 1. Lint 妫€鏌?==========
  lint:
    name: 浠ｇ爜妫€鏌?(Lint)
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 璁剧疆 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 璧嬩簣 gradlew 鎵ц鏉冮檺
        run: chmod +x gradlew

      - name: 鎵ц Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 涓婁紶 Lint 鎶ュ憡
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ========== 2. 鍗曞厓娴嬭瘯 ==========
  test:
    name: 鍗曞厓娴嬭瘯
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 璁剧疆 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 璧嬩簣 gradlew 鎵ц鏉冮檺
        run: chmod +x gradlew

      - name: 杩愯鍗曞厓娴嬭瘯
        run: ./gradlew testDebugUnitTest

      - name: 涓婁紶娴嬭瘯鎶ュ憡
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # ========== 3. 鏋勫缓 APK ==========
  build:
    name: 鏋勫缓 ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write  # 鐢ㄤ簬鍒涘缓 Release

    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 璁剧疆 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 璧嬩簣 gradlew 鎵ц鏉冮檺
        run: chmod +x gradlew

      - name: 瑙ｇ爜绛惧悕 Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          ls -la app/keystore/

      - name: 璇诲彇鐗堟湰鍙?        id: version
        run: |
          VERSION_NAME=$(./gradlew -q :app:properties | grep "^versionName:" | awk '{print $2}' | tr -d '\r')
          VERSION_CODE=$(./gradlew -q :app:properties | grep "^versionCode:" | awk '{print $2}' | tr -d '\r')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "鐭?SHA: ${GITHUB_SHA::7}"
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 鏋勫缓 APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}
          GRADLE_OPTS=""
          if [ -f "app/keystore/release.keystore" ]; then
            echo "==> 浣跨敤绛惧悕閰嶇疆"
            GRADLE_OPTS="-PWFB_KEYSTORE_FILE=app/keystore/release.keystore \
              -PWFB_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -PWFB_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
              -PWFB_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "==> 鏈厤缃鍚嶏紝鐢熸垚鏈鍚?APK"
          fi
          ./gradlew assemble${BUILD_TYPE^} $GRADLE_OPTS --stacktrace

      - name: 鏀堕泦浜х墿
        run: |
          mkdir -p dist
          BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}
          find app/build/outputs/apk/$BUILD_TYPE -name "*.apk" -exec cp -v {} dist/ \;
          # 鏀堕泦 mapping 鏂囦欢锛堢敤浜?Crash 鍙嶆贩娣嗭級
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/
          fi
          echo "==> 浜х墿鍒楄〃锛?
          ls -lh dist/

      - name: 涓婁紶 APK 鍒跺搧
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: |
            dist/*.apk
            dist/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: 闄勫姞鍒?GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WiFi Battle Platform ${{ steps.version.outputs.version_name }}
          body: |
            ## WiFi Battle Platform v${{ steps.version.outputs.version_name }}

            - 鏋勫缓 SHA: `${{ steps.version.outputs.short_sha }}`
            - 鏋勫缓鏃堕棿: ${{ github.event.repository.updated_at }}
            - 鎻愪氦: ${{ github.event.head_commit.message }}

            ### 涓嬭浇
            涓嬫柟闄勪欢涓烘瀯寤轰骇鐗┿€?          files: |
            dist/*.apk
            dist/mapping.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  # ========== 4. 涓婁紶鍒?CDN/S3锛堝彲閫夛級 ==========
  deploy-cdn:
    name: 涓婁紶鍒?CDN
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.upload_to_cdn == 'true' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    steps:
      - name: 涓嬭浇 APK 鍒跺搧
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: dist/

      - name: 閰嶇疆 AWS 鍑瘉
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 涓婁紶鍒?S3
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          for apk in dist/*.apk; do
            aws s3 cp "$apk" "s3://${S3_BUCKET}/wifibattle/v${VERSION}/$(basename $apk)" \
              --acl public-read \
              --cache-control "max-age=3600"
            echo "==> 涓婁紶鎴愬姛: https://${S3_BUCKET}.s3.amazonaws.com/wifibattle/v${VERSION}/$(basename $apk)"
          done

      - name: 鍒涘缓鏈€鏂扮増鏈摼鎺?        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          for apk in dist/*.apk; do
            name=$(basename $apk)
            aws s3 cp "$apk" "s3://${S3_BUCKET}/wifibattle/latest/${name}" --acl public-read
          done

  # ========== 5. 閮ㄧ讲鍒?Play 鍟嗗簵锛堝彲閫夛級 ==========
  deploy-play:
    name: 閮ㄧ讲鍒?Google Play
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
    timeout-minutes: 30
    steps:
      - name: 涓嬭浇 AAB
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: dist/

      - name: 涓婁紶鍒?Play 鍟嗗簵
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.wifibattle
          releaseFiles: dist/*.apk
          track: internal
          status: completed
          mappingFile: dist/mapping.txt
          whatsNewDirectory: whatsnew/
