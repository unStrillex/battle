name: Android Build

# 主构建工作流
# 触发条件:
#   - push 到 main / develop 分支
#   - 创建 v* tag → 自动发布 Release
#   - Pull Request
#   - 手动触发

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      upload_to_cdn:
        description: '上传到 CDN'
        required: false
        default: 'false'
        type: boolean

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  ANDROID_HOME: /opt/android-sdk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 1. Lint 检查 ==========
  lint:
    name: 代码检查 (Lint)
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 执行 Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ========== 2. 单元测试 ==========
  test:
    name: 单元测试
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: 17
          distribution: temurin
          cache-disabled: true
          add-proxy-ip-jvmargs: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # ========== 3. 构建 APK ==========
  build:
    name: 构建 ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write  # 用于创建 Release

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          java-version: 17
          distribution: temurin
          cache-disabled: true
          add-proxy-ip-jvmargs: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 解码签名 Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          ls -la app/keystore/

      - name: 读取版本号
        id: version
        run: |
          VERSION_NAME=$(./gradlew -q :app:properties | grep "^versionName:" | awk '{print $2}' | tr -d '\r')
          VERSION_CODE=$(./gradlew -q :app:properties | grep "^versionCode:" | awk '{print $2}' | tr -d '\r')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "短 SHA: ${GITHUB_SHA::7}"
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 构建 APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}
          GRADLE_OPTS=""
          if [ -f "app/keystore/release.keystore" ]; then
            echo "==> 使用签名配置"
            GRADLE_OPTS="-PWFB_KEYSTORE_FILE=app/keystore/release.keystore \
              -PWFB_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              -PWFB_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
              -PWFB_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "==> 未配置签名,生成未签名 APK"
          fi
          ./gradlew assemble${BUILD_TYPE^} $GRADLE_OPTS --stacktrace

      - name: 收集产物
        run: |
          mkdir -p dist
          BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}
          find app/build/outputs/apk/$BUILD_TYPE -name "*.apk" -exec cp -v {} dist/ \;
          # 收集 mapping 文件(用于 Crash 反混淆)
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/
          fi
          echo "==> 产物列表:"
          ls -lh dist/

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: |
            dist/*.apk
            dist/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WiFi Battle Platform ${{ steps.version.outputs.version_name }}
          body: |
            ## WiFi Battle Platform v${{ steps.version.outputs.version_name }}

            - 构建 SHA: `${{ steps.version.outputs.short_sha }}`
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 提交: ${{ github.event.head_commit.message }}

            ### 下载
            下方附件为构建产物。
          files: |
            dist/*.apk
            dist/mapping.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  # ========== 4. 上传到 CDN/S3(可选) ==========
  deploy-cdn:
    name: 上传到 CDN
    runs-on: ubuntu-22.04
    needs: [build]
    if: github.event.inputs.upload_to_cdn == 'true' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    steps:
      - name: 下载 APK 制品
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: dist/

      - name: 配置 AWS 凭证
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 上传到 S3
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          for apk in dist/*.apk; do
            aws s3 cp "$apk" "s3://${S3_BUCKET}/wifibattle/v${VERSION}/$(basename $apk)" \
              --acl public-read \
              --cache-control "max-age=3600"
            echo "==> 上传成功: https://${S3_BUCKET}.s3.amazonaws.com/wifibattle/v${VERSION}/$(basename $apk)"
          done

      - name: 创建最新版本链接
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          for apk in dist/*.apk; do
            name=$(basename $apk)
            aws s3 cp "$apk" "s3://${S3_BUCKET}/wifibattle/latest/${name}" --acl public-read
          done

  # ========== 5. 部署到 Play 商店(可选) ==========
  deploy-play:
    name: 部署到 Google Play
    runs-on: ubuntu-22.04
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
    timeout-minutes: 30
    steps:
      - name: 下载 AAB
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type || 'release' }}-apk
          path: dist/

      - name: 上传到 Play 商店
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.wifibattle
          releaseFiles: dist/*.apk
          track: internal
          status: completed
          mappingFile: dist/mapping.txt
          whatsNewDirectory: whatsnew/
